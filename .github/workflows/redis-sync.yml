name: Sync TOML to Redis

on:
  push:
    branches: 
      - realtimex
    paths:
      - 'providers/**/*.toml'
      - '.github/scripts/sync_toml_to_redis.py'
      - '.github/workflows/redis-sync.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Debug - List changed files
        run: |
          git diff --name-only ${{ github.event.before }} ${{ github.sha }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install redis
      
      - name: Scan TOML files and sync to Redis
        env:
          REALTIMEX_AI_LLM_REDIS_HOST: ${{ secrets.REALTIMEX_AI_LLM_REDIS_HOST }}
          REALTIMEX_AI_LLM_REDIS_PASSWORD: ${{ secrets.REALTIMEX_AI_LLM_REDIS_PASSWORD }}
          REALTIMEX_AI_LLM_REDIS_PORT: ${{ secrets.REALTIMEX_AI_LLM_REDIS_PORT }}
          REALTIMEX_AI_LLM_REDIS_DB: ${{ secrets.REALTIMEX_AI_LLM_REDIS_DB }}
        run: |
          python .github/scripts/sync_toml_to_redis.py